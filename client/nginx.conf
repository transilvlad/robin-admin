server {
    listen 80;
    server_name localhost;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Written at start by docker-entrypoint.d/10-base-path.sh (BASE_PATH).
    root /tmp/html;
    index index.html;

    # Compress text-based responses; images/fonts are already compressed formats.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript
        application/xml application/xml+rss application/wasm image/svg+xml font/ttf font/otf;

    # Security headers are repeated in every location: an add_header inside a
    # location replaces all add_header lines inherited from the server block.

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Written at start by docker-entrypoint.d/20-security-policy.sh.
        include /tmp/nginx-security-policy.conf;
    }

    # JS/CSS chunk names can be stable across module-federation rebuilds.
    # Revalidate them so deploys and local rebuilds do not serve stale UI.
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache static media and fonts.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
